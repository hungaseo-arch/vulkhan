<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ascendo-symbol.png" />
    <link rel="apple-touch-icon" href="/ascendo-symbol.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0062C6" />
    <!-- Font: preconnect + preload non-blocking. Sebelumnya @import di dalam JS
         menunda font sampai React selesai render (rantai HTML→JS→CSS→font). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans:wght@300;400;500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans:wght@300;400;500;700&display=swap"
      />
    </noscript>
    <title>VULKHAN — Manajemen Stok & Penjualan Ban Vulkanisir</title>
    <meta
      name="description"
      content="VULKHAN — sistem manajemen stok gudang, penjualan, pembelian, dan piutang untuk usaha ban vulkanisir."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VULKHAN" />
    <meta property="og:title" content="VULKHAN — Manajemen Stok & Penjualan Ban Vulkanisir" />
    <meta
      property="og:description"
      content="Sistem manajemen stok gudang, penjualan, pembelian, dan piutang untuk usaha ban vulkanisir."
    />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:image" content="/ascendo-signature.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
